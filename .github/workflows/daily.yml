
name: Daily LeetCode Agent

on:
  schedule:
    # Every day at 8:00 AM IST (02:30 UTC)
    - cron: "30 2 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only; do not submit"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: daily-leetcode-agent
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LEETCODE_COOKIE: ${{ secrets.LEETCODE_COOKIE }}
      LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
      PROBLEMS_PER_DAY: "3"
      DIFFICULTIES: "EASY,MEDIUM,HARD"
      PYTHONUNBUFFERED: "1"
      # Scheduled runs stay safe; manual runs honor the dry_run input.
      DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install LeetCode CLI
        run: |
          git clone https://github.com/michal-pielka/leetcode_cli.git /tmp/leetcode_cli
          python -m pip install /tmp/leetcode_cli
          echo "$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))')" >> "$GITHUB_PATH"
          command -v leetcode
          leetcode --help

      - name: Validate secrets
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || {
            echo "Missing OPENAI_API_KEY"
            exit 1
          }
          test -n "$LEETCODE_COOKIE" || {
            echo "Missing LEETCODE_COOKIE"
            exit 1
          }
          test -n "$LEETCODE_USERNAME" || {
            echo "Missing LEETCODE_USERNAME"
            exit 1
          }

      - name: Configure LeetCode
        shell: bash
        run: |
          set +x
          leetcode config cookie "$LEETCODE_COOKIE" >/dev/null
          leetcode config username "$LEETCODE_USERNAME" >/dev/null
          leetcode config language python >/dev/null
          echo "LeetCode CLI configured"

      - name: Run AI agent
        run: python agent.py

      - name: Upload daily report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leetcode-report-${{ github.run_id }}
          path: |
            reports/
            solutions/
          if-no-files-found: ignore
          retention-days: 14

      - name: Save problem history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/history.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: update LeetCode history"
            git push
          fi
