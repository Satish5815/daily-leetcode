name: Daily LeetCode Agent
'on':
  schedule:
    - cron: 30 2 * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: Test without submitting solutions
        type: boolean
        required: true
        default: true
permissions:
  contents: write
concurrency:
  group: daily-leetcode-agent
  cancel-in-progress: false
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: '${{ secrets.OPENAI_API_KEY }}'
      LEETCODE_COOKIE: '${{ secrets.LEETCODE_COOKIE }}'
      LEETCODE_USERNAME: '${{ secrets.LEETCODE_USERNAME }}'
      PROBLEMS_PER_DAY: '3'
      DIFFICULTIES: 'EASY,MEDIUM,HARD'
      PYTHONUNBUFFERED: '1'
      DRY_RUN: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Install LeetCode CLI
        shell: bash
        run: |
          set -e
          git clone \
            https://github.com/michal-pielka/leetcode_cli.git \
            /tmp/leetcode_cli
          python -m pip install /tmp/leetcode_cli
          python -m leetcode_cli.cli --help
      - name: Validate secrets
        shell: bash
        run: |
          set -e

          test -n "$OPENAI_API_KEY" || {
            echo "Missing OPENAI_API_KEY"
            exit 1
          }

          test -n "$LEETCODE_COOKIE" || {
            echo "Missing LEETCODE_COOKIE"
            exit 1
          }

          test -n "$LEETCODE_USERNAME" || {
            echo "Missing LEETCODE_USERNAME"
            exit 1
          }

          echo "Required secrets are present."
      - name: Configure LeetCode
        shell: bash
        run: |
          set -e
          set +x
          python -m leetcode_cli.cli config cookie \
            "$LEETCODE_COOKIE" >/dev/null
          python -m leetcode_cli.cli config username \
            "$LEETCODE_USERNAME" >/dev/null
          python -m leetcode_cli.cli config language python >/dev/null
          echo "LeetCode CLI configured."
      - name: Run AI agent
        run: python agent.py
      - name: Upload daily report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'leetcode-report-${{ github.run_id }}'
          path: |
            reports/
            solutions/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save problem history
        if: success()
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/history.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: update LeetCode history"
            git push
          fi
